apiVersion: v1
kind: ConfigMap
metadata:
  name: ragllm-config
  namespace: ragllm
data:
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "ragllm"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: ragllm-secrets
  namespace: ragllm
type: Opaque
stringData:
  DB_USERNAME: ragllm
  DB_PASSWORD: ragllm-secure-password
  JWT_SECRET: your-production-secure-jwt-secret-key-must-be-at-least-32-characters
  OPENAI_API_KEY: your-openai-api-key-here
