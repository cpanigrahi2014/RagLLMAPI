# Template for deploying each microservice
# Replace ${SERVICE_NAME}, ${SERVICE_PORT}, ${IMAGE} with actual values

# ─── Auth Service ────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: ragllm
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8081"
    spec:
      containers:
        - name: auth-service
          image: ragllm/auth-service:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: ragllm-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ragllm-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ragllm-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ragllm-secrets
                  key: JWT_SECRET
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: ragllm
spec:
  selector:
    app: auth-service
  ports:
    - port: 8081
      targetPort: 8081

---
# ─── Document Service ────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-service
  namespace: ragllm
  labels:
    app: document-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: document-service
  template:
    metadata:
      labels:
        app: document-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8082"
    spec:
      containers:
        - name: document-service
          image: ragllm/document-service:latest
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: ragllm-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ragllm-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ragllm-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ragllm-secrets
                  key: JWT_SECRET
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ragllm-secrets
                  key: OPENAI_API_KEY
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "2000m"
          volumeMounts:
            - name: upload-storage
              mountPath: /app/uploads
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 5
      volumes:
        - name: upload-storage
          persistentVolumeClaim:
            claimName: upload-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: document-service
  namespace: ragllm
spec:
  selector:
    app: document-service
  ports:
    - port: 8082
      targetPort: 8082
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: upload-pvc
  namespace: ragllm
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi

