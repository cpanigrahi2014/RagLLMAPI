version: '3.8'

services:
  # ─── Infrastructure ───────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ragllm-postgres
    environment:
      POSTGRES_DB: ragllm
      POSTGRES_USER: ragllm
      POSTGRES_PASSWORD: ragllm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragllm"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ragllm-network

  redis:
    image: redis:7-alpine
    container_name: ragllm-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ragllm-network

  # ─── Application Services ─────────────────────────────────
  api-gateway:
    build: ./api-gateway
    container_name: ragllm-gateway
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
      AUTH_SERVICE_URL: http://auth-service:8081
      DOCUMENT_SERVICE_URL: http://document-service:8082
      EMBEDDING_SERVICE_URL: http://embedding-service:8083
      RAG_QUERY_SERVICE_URL: http://rag-query-service:8084
      BILLING_SERVICE_URL: http://billing-service:8085
      ANALYTICS_SERVICE_URL: http://analytics-service:8086
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ragllm-network

  auth-service:
    build: ./auth-service
    container_name: ragllm-auth
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ragllm
      DB_USERNAME: ragllm
      DB_PASSWORD: ragllm
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-your-production-secret-key-must-be-at-least-32-characters-long}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ragllm-network

  document-service:
    build: ./document-service
    container_name: ragllm-document
    ports:
      - "8082:8082"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ragllm
      DB_USERNAME: ragllm
      DB_PASSWORD: ragllm
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-your-production-secret-key-must-be-at-least-32-characters-long}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      EMBEDDING_SERVICE_URL: http://embedding-service:8083
    volumes:
      - upload_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ragllm-network

  embedding-service:
    build: ./embedding-service
    container_name: ragllm-embedding
    ports:
      - "8083:8083"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ragllm
      DB_USERNAME: ragllm
      DB_PASSWORD: ragllm
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-your-production-secret-key-must-be-at-least-32-characters-long}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ragllm-network

  rag-query-service:
    build: ./rag-query-service
    container_name: ragllm-query
    ports:
      - "8084:8084"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ragllm
      DB_USERNAME: ragllm
      DB_PASSWORD: ragllm
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-your-production-secret-key-must-be-at-least-32-characters-long}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ragllm-network

  billing-service:
    build: ./billing-service
    container_name: ragllm-billing
    ports:
      - "8085:8085"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ragllm
      DB_USERNAME: ragllm
      DB_PASSWORD: ragllm
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-your-production-secret-key-must-be-at-least-32-characters-long}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ragllm-network

  analytics-service:
    build: ./analytics-service
    container_name: ragllm-analytics
    ports:
      - "8086:8086"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ragllm
      DB_USERNAME: ragllm
      DB_PASSWORD: ragllm
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-your-production-secret-key-must-be-at-least-32-characters-long}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ragllm-network

  # ─── Monitoring ────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: ragllm-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - ragllm-network

volumes:
  postgres_data:
  redis_data:
  upload_data:
  prometheus_data:

networks:
  ragllm-network:
    driver: bridge
